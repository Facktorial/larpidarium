[decision]
segment = "patro-5"
title = "Jak skončí příběh?"
owners = ["karel-capek"]
brief = "Spisovatel neví, jak svůj příběh dopsat. Ptá se vás, čtenářů."
text = """
Konec adventury. Čapek, jako na konci Války s mloky, neví, jak to skončit, a obrátí se na čtenáře.
Má-li tým MefiKarlův přístroj, může ho Čapkovi předat. Jinak (nebo když Čapka pohltí Nicota dřív)
nastane konec Nicotou.
"""

[[decision.option]]
label = "Předat Čapkovi MefiKarlův přístroj"
needs = ["cesta-k-capkovi", "mefikarluv-pristroj"]
gives = ["konec-pristroj"]

[[decision.option]]
label = "Nechat Čapka psát dál"
needs = ["cesta-k-capkovi"]
gives = ["konec-nicota"]
