[[info]]
id = "zprava-o-nicote"
name = "Informace o Nicotě"
text = "Atreyu slouží primárně jako zdroj informací o Nicotě a mechanismech okolo."

[[info]]
id = "cesta-do-nebe"
name = "Cesta do Nebe"
text = "Otevře se, když hráči obětují beránka v Krbu Strážcům."

[[info]]
id = "odpoved"
name = "Odpověď"
text = "Nudliel nabízí odpověď, nikoli řešení: to, co hledá Atrej. Věštba obsahuje forshadowing na Lucifemme a možná naznačuje, že boj s Nicotou prohrajeme."

[[info]]
id = "rorschach-vi-o-nicote"
name = "Rorschach ví o Nicotě"
text = "Dojde mu, že Nicota je důsledkem MefiKarlovy nepřítomnosti. Rozhodne se přivést Karla."

[[info]]
id = "neco-zasadniho"
name = "Něco zásadního od Rorschacha"
text = "Poznámky: „vydá něco, co je zásadní pro postup dál“. Co to je, zatím není vymyšlené."

[[info]]
id = "gabriel-vi-o-pekle"
name = "Gabriel tuší, že se v pekle něco děje"
text = "V dalším patře přichází Gabriel."

[[info]]
id = "nastroj-proti-nicote"
name = "Newtonův nástroj proti Nicotě"
text = "Vyzkoumá ho ze Stark Technology."

[[info]]
id = "sherlockuv-pripad"
name = "Sherlockův případ: Newton ukradl Diferenciální počet"

[[info]]
id = "revoluce"
name = "Revoluce: znárodnění poloviny itemů"
text = "Když mají hráči u Marxe aspoň 3 red flagy."

[[info]]
id = "disney-neco-vyda"
name = "Disney něco vydá"
text = "Když se mu podaří naverbovat Nolana, Damona a Mc-týpka. Co vydá, zatím není vymyšlené."

[[info]]
id = "kun-pohlcen"
name = "Nicota pohltila koně"
text = "Když se odemkne druhé patro. Atreyu udělá dramatickou scénu, kterou musí zaznamenat všechny týmy."

[[info]]
id = "konec-pristroj"
name = "Konec: MefiKarlův přístroj"
ending = true
text = "Cílem hry je získat MefiKarlův přístroj, který Nicotu zastaví."

[[info]]
id = "konec-capek"
name = "Konec: Karel Čapek"
ending = true
text = "Podobný konec jako u Války s mloky: autor neví, jak zakončit příběh, ptá se na pomoc čtenáře."
