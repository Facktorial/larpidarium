[person]
name = "Ea Nasir"
role = "npc"
color = "#c0392b"

[person.sheet]
whereabouts = "Patro 4"
poznamky = """
mezopotámský obchodník s mědí, známý díky nejstarší dochované stížnosti od zákazníka
bude hráčům dodávat měď, ale hodně nekvalitní měď
bude se k hráčům chovat extrémně pohrdlivě, on je něco víc než oni
může obchodovat i s dalším zbožím, ale vždycky tak, aby to pro hráče bylo nevýhodné
umí poskytnout měděný klíč k Pandořině skříňce (protože jeho měď je stejně zkažená jako všechno ve skříňce); popřípadě poskytuje jenom měď a klíč vyrobí Utanapištim
"""
