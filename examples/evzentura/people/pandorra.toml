[person.sheet]
whereabouts = "Patro 2"
poznamky = """
má Pandořinu skříňku, ve které je MefiKarlův přístroj
nejdřív říká, že je skříňka zamčená a že ji nesmíme otevírat - působí to, jako že naším cílem bude sehnat klíč a sebrat jí krabičku
když se dostaneme do dalšího patra, tak skříňku už nemá, někdo jí ji ukradl
později se Pandořina skříňka ještě někde mihne (už bez Pandory), nakonec se ukáže, že ji sebral Karel
Alternativa: z postav pohlcených Nicotou se stávají „lži a manipulace“, tj. jsou teleportovány do Pandořiny skříňky; skříňka by pak umožňovala kontakt s pohlcenými postavami
"""
