[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "WTFPL"
repository = "https://github.com/Rustic-Baguettes-Inc/larpidarium"
publish = false

[workspace.dependencies]
# internal crates
larp-graph = { path = "crates/larp-graph" }
larp-model = { path = "crates/larp-model" }
larp-render = { path = "crates/larp-render" }

# external crates: versions live here only, crates use `dep.workspace = true`
clap = { version = "4.5", features = ["derive"] }
miette = { version = "7.6", features = ["fancy"] }
minijinja = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tiny_http = "0.12"
toml = "0.9"
toml_edit = "0.25"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
strip = true
