brief = "Detektiv chce uzavřít případ. Vědec chce, aby se nikdy neuzavřel. Na čí stranu se postavíte?"
text = """
Když tým Sherlockovi pomůže Newtona usvědčit, Sherlock je volný a z Achillovy stopy dedukuje,
kterému Karlovi skříňka patří (Karel IV., relikvie na Karlštejně). Když tým Newtona varuje,
Newton se vděčně zbaví důkazu a dá týmu Diferenciální počet; Sherlock odejde s nepořízenou.
"""

[[decision.option]]
label = "Usvědčit Newtona"
needs = ["pripad-sherlock", "stopa-skrinky"]
