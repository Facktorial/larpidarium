[decision]
segment = "nebe"
title = "Jak dostat Antinoa od Gabriela?"
owners = ["antinoos", "gabriel"]
brief = "Ke Gabrielovi se nedostanete, dokud u něj sedí Antinoos. Co ho přiměje odejít?"
text = """
Antinoos se od Gabriela hne jen za dvě věci. Buď se smíří s obrázkem zadku od Zadkiela, roztaje,
a z vděčnosti týmu prozradí, jak se Diova zákona dovolat (týmy, které scénář prodaly Disneymu,
tak dostanou druhou šanci u Nudliela). Nebo mu tým prozradí, kde najde Odyssea: Antinoos odejde
dolů ho zabít a plechovku Argus nechá týmu.
"""

[[decision.option]]
label = "Dát Antinoovi obrázek od Zadkiela"
needs = ["antinoos-obleha-gabriela"]
uses = ["obrazek-zadku"]
gives = ["gabriel-volny", "diuv-zakon"]

[[decision.option]]
label = "Prozradit Antinoovi, kde je Odysseus"
needs = ["antinoos-obleha-gabriela"]
gives = ["gabriel-volny", "plechovka-argus"]
