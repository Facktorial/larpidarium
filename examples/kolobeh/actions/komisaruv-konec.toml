text = "Cena: komisař v tomto kroku zemře. Uložit knihu do archivu může, jen když ji taxikář má (dokař ji hodil jemu). Zápis do složky Koloběh i archiv dají nástupci důvod k odvaze. Obálka nedá nic a kniha zůstane v taxíku."

[[decision.option]]
label = "Nechat taxikáře přivézt knihu a uložit ji do archivu"
