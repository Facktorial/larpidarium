[person]
name = "Atreyu (a ten jeho kůň)"
role = "npc"
color = "#c0392b"

[person.sheet]
whereabouts = "Patro 1"
poznamky = """
jsou v prvním patře, bojují proti Nicotě, jako v Nekonečném příběhu
Atreyu slouží primárně jako zdroj informací o Nicotě a mechanismech okolo
když se odemkne druhé patro, Nicota přichází, pohltí koně, Atreyu udělá hodně dramatickou scénu, kterou musí zaznamenat všechny týmy
když je kůň pohlcen Nicotou, postava Atreyu pořád funguje jako předtím, kůň byl úplně zbytečný
hledá „odpověď“, ne „řešení“ - najde u vědmy
hráči budou myslet, že chce způsob, jak bojovat proti Nicotě. Takové způsoby budou dostupné už od patra 2. Ale odpověď zná až vědma v patře 3
hráči budou muset hrát hodně rychle, aby tuhle dějovou linii splnili, než Atreyu zmizí v Nicotě
"""
