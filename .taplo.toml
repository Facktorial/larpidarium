include = ["**/*.toml"]
exclude = ["target/**", "drafts/**", "world/**"] # drafts and world are private, gitignored

[formatting]
align_comments = true
array_auto_collapse = true
column_width = 100
indent_string = "  "
reorder_keys = false

# Game file schemas (generated by `larpidarium schema`, kept in sync by a test) for the examples.

[[rule]]
include = ["examples/*/game.toml"]
[rule.schema]
path = "./schemas/game.schema.json"

[[rule]]
include = ["examples/*/segments.toml"]
[rule.schema]
path = "./schemas/segments.schema.json"

[[rule]]
include = ["examples/*/players.toml"]
[rule.schema]
path = "./schemas/players.schema.json"

[[rule]]
include = ["examples/*/cycles.toml"]
[rule.schema]
path = "./schemas/cycles.schema.json"

[[rule]]
include = ["examples/*/rooms.toml"]
[rule.schema]
path = "./schemas/rooms.schema.json"

[[rule]]
include = ["examples/*/items.toml"]
[rule.schema]
path = "./schemas/items.schema.json"

[[rule]]
include = ["examples/*/info.toml"]
[rule.schema]
path = "./schemas/info.schema.json"

[[rule]]
include = ["examples/*/people/*.toml"]
[rule.schema]
path = "./schemas/person.schema.json"

[[rule]]
include = ["examples/*/actions/*.toml"]
[rule.schema]
path = "./schemas/action.schema.json"

[[rule]]
include = ["examples/*/layout.toml"]
[rule.schema]
path = "./schemas/layout.schema.json"

[[rule]]
include = ["examples/*/map.toml", "examples/*/map-presets/*.toml"]
[rule.schema]
path = "./schemas/map.schema.json"
