Opat tě přijal, když tě nikdo jiný nechtěl. Den před jeho zmizením ti řekl:
„Kdyby se mi něco stalo, otevři ten dopis.“
"""

[[person.relation]]
with = "brother-anselm"
text = "Pokladník. Od opatova zmizení je nervózní."

[[person.relation]]
with = "inspector-hugo"
text = "Biskupův vyšetřovatel, přijel nečekaně. Opatův dopis je adresován biskupovi. Patří tedy jemu?"
